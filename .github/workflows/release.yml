name: Release

# Wie Suite-Launcher .github/workflows/release.yml. Der einzige Weg zur Veröffentlichung: Tag v* pushen (oder von Hand
# unter Actions mit Tag-Eingabe). Baut die macOS-Images (Apple-Chip, Intel) und den Windows-Installer, erzeugt
# SHA256SUMS und veröffentlicht alles als GitHub-Release (Vorabversion, Alpha) mit dem Text aus docs/releases/<tag>.md.
# Ein vorhandenes Release wird nie überschrieben; der Tag muss existieren (--verify-tag) und zu package.json passen. Actions sind auf Commit-SHA gepinnt (Kommentar = Version).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, z. B. v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - os: windows-latest
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}  # bei workflow_dispatch genau den Tag bauen
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.files }}
          retention-days: 7

  release:
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}  # bei workflow_dispatch genau den Tag bauen
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-*
          path: out
          merge-multiple: true
      - name: SHA256SUMS
        run: cd out && sha256sum Crew-Link-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release (pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la out
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Tag-Format falsch: $TAG (erwartet vX.Y.Z)"; exit 1;; esac
          VER="$(node -p "require('./package.json').version")"
          test "${TAG#v}" = "$VER" || { echo "Tag $TAG passt nicht zu package.json $VER"; exit 1; }
          NOTES="docs/releases/$TAG.md"
          test -f "$NOTES" || { echo "fehlt: $NOTES"; exit 1; }
          for f in Crew-Link-macos-arm64.dmg Crew-Link-macos-intel.dmg Crew-Link-windows.exe; do
            test -f "out/$f" || { echo "fehlt: $f"; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG gibt es schon – nichts überschrieben"; exit 1; fi
          gh release create "$TAG" --verify-tag --prerelease --title "Crew Link ${TAG#v} – Alpha" --notes-file "$NOTES" out/Crew-Link-* out/SHA256SUMS
